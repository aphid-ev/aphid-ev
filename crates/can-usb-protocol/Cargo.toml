[package]
name = "can-usb-protocol"
version = "0.1.0"
description = "Wire format between the CAN/USB interface and the host"
edition.workspace = true
repository.workspace = true

[dependencies]
defmt = { version = "1.1.1", optional = true }
embedded-can = "0.4.1"
serde = { version = "1.0.229", features = ["derive"], default-features = false }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }

[features]
defmt = ["dep:defmt"]

name: Bootloader

on:
  push:
    branches: [main]
    paths: &paths
      - ecus/bootloader/**
      - crates/**
      - tools/boot-image/**
      - Cargo.toml
      - Cargo.lock
      - justfile
      - rust-toolchain.toml
      - .github/actions/**
      - .github/workflows/ecu.yml
      - .github/workflows/bootloader.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecu:
    uses: ./.github/workflows/ecu.yml
    with:
      component: bootloader
      workspace: |
        ecus/bootloader
        ecus/bootloader/can-echo
        .
      hardware: false

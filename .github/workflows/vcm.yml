name: VCM

on:
  push:
    branches: [main]
    paths: &paths
      - ecus/vcm/**
      - ecus/*.just
      - crates/**
      - justfile
      - rust-toolchain.toml
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/ecu.yml
      - .github/workflows/vcm.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecu:
    uses: ./.github/workflows/ecu.yml
    with:
      component: vcm
      workspace: |
        ecus/vcm/firmware/main
        ecus/vcm/firmware/monitor

name: BMS

on:
  push:
    branches: [main]
    paths: &paths
      - ecus/bms/**
      - ecus/libraries/**
      - ecus/*.just
      - crates/**
      - justfile
      - rust-toolchain.toml
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/ecu.yml
      - .github/workflows/bms.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecu:
    uses: ./.github/workflows/ecu.yml
    with:
      component: bms
      # ERC and DRC are off until the system design is settled. Task: v438
      hardware: false

name: CAN/USB

# Firmware and hardware only. The host library in ecus/can-usb/host is part of
# the host workspace and is checked by host.yml.
on:
  push:
    branches: [main]
    paths: &paths
      - ecus/can-usb/**
      - '!ecus/can-usb/host/**'
      - ecus/*.just
      - crates/**
      - justfile
      - rust-toolchain.toml
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/ecu.yml
      - .github/workflows/can-usb.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecu:
    uses: ./.github/workflows/ecu.yml
    with:
      component: can-usb

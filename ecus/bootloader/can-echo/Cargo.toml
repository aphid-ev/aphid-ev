[package]
name = "can-echo"
version = "0.1.0"
edition = "2024"

[dependencies]
# Deliberately without "memory-x": that feature generates a layout covering
# the whole chip from 0x08000000, which would overlap the bootloader. The
# memory.x in this directory places the image at the application offset.
embassy-stm32 = { version = "0.6.0", features = [
    "time-driver-any",
    "stm32g431cb",
    "exti",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"
boot-protocol = { path = "../../../crates/boot-protocol" }

# A standalone workspace, not part of the bootloader's.
[workspace]

[profile.release]
lto = true
opt-level = "z"
incremental = false
codegen-units = 1
debug = 2

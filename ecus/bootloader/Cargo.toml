[package]
name = "bootloader"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
boot-protocol = { path = "../../crates/boot-protocol" }
fdcan = { version = "0.2.1", features = ["fdcan_g0_g4_l5"] }
panic-halt = "1.0.0"
# The chip module is selected by this crate's own chip feature below.
stm32g4 = { version = "0.16.0" }

# A standalone workspace, not part of the host workspace at the root.
[workspace]

[profile.release]
lto = true
opt-level = "z"
incremental = false
codegen-units = 1
debug = true

# Exactly one of these must be selected. Each picks both the flash layout
# and the matching PAC chip module; see the `pac` alias in src/main.rs.
[features]
stm32g431cx = ["stm32g4/stm32g431"]
# Every 512 KiB STM32G491 package (CE, RE, ...).
stm32g491xe = ["stm32g4/stm32g491"]

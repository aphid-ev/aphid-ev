[package]
name = "vcm-main"
version = "0.1.0"
description = "VCM firmware for the main MCU, STM32F405RG"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "time-driver-any",
    "stm32f405rg",
    "memory-x",
] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
ev-can = { path = "../../../../crates/ev-can" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
vcm-core = { path = "../../../../crates/vcm-core" }

# A standalone workspace, not part of the host workspace at the root.
[workspace]

[profile.release]
lto = true
opt-level = "s"
incremental = false
codegen-units = 1
debug = 2

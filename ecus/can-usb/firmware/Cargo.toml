[package]
name = "can-usb"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "time-driver-any",
    "stm32g431cb",
    "memory-x",
    "exti",
    "unstable-pac",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-1_000_000",
] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
defmt = "1.2.0"
defmt-rtt = "1.3.1"

cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embedded-hal = "1.0.0"
embedded-can = { version = "0.4.1" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
can-usb-protocol = { path = "../../../crates/can-usb-protocol", features = ["defmt"] }
static_cell = "2.1.1"

# A standalone workspace, not part of the host workspace at the root.
[workspace]

[profile.release]
lto = true
# Flash used, of 128 KiB: "z" 44 748 bytes, "s" 44 668, 3 57 212.
opt-level = "s"
incremental = false
codegen-units = 1
debug = 2
